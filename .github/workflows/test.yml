name: Linux build and tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y g++ make
      - run: ./setup.sh
      - run: PATH="$PWD/.venv/bin:$PATH" make test
      - run: ./run.sh demo
      - run: ./run.sh benchmark --width 64 --height 48 --iterations 3 --csv results/ci.csv
